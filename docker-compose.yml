name: file-service

services:
  postgres:
    container_name: postgres-fs
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: file_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "15434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    container_name: rabbitmq-fs
    image: rabbitmq:4-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      shared-network:
        aliases:
          - platform-rabbitmq

  seq:
    container_name: seq-fs
    image: datalust/seq:latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5342:5341"
      - "8082:80"

  minio:
    container_name: file-service-minio
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: redis-fs
    image: redis:alpine
    restart: always
    ports:
      - "6381:6379"

  file-service:
    build:
      context: .
      dockerfile: src/FileService.Web/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: file-service
    restart: always
    ports:
      - "8003:8003"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8003"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=file_service_db;Username=postgres;Password=1234"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@platform-rabbitmq:5672"
      ConnectionStrings__Redis: "redis:6379"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      FileStorageOptions__Endpoint: "http://minio:9000"
      FileStorageOptions__ExternalEndpoint: "http://localhost:9000"
      FileStorageOptions__AccessKey: "minioadmin"
      FileStorageOptions__SecretKey: "minioadmin"
    depends_on:
      postgres:
        condition: service_started
      seq:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - shared-network

volumes:
  postgres-data:
    name: fileservice-postgres-data
  minio-data:
  rabbitmq_data:

networks:
  shared-network:
    external: true
